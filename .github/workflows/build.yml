name: Build DTFA APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a full Android SDK (cmdline-tools,
      # platform-tools, a recent platform/build-tools) at $ANDROID_HOME.
      # We stopped using android-actions/setup-android@v3 here: it runs
      # `sdkmanager tools` internally to "prime" the SDK, and that legacy
      # `tools` package no longer exists in Google's repository, which made
      # the whole step fail with exit code 1 (that's the crash you hit).
      - name: Accept SDK licenses & install NDK/CMake
        run: |
          set -euxo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f | sort -V | tail -n1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      # --------------------------------------------------------------
      # proot binary (arm64-v8a). Packaged as "libproot.so" and dropped
      # into jniLibs so Android's package manager extracts it to a real,
      # executable file at install time (avoids the "noexec on app data"
      # problem newer Android versions have for files extracted at runtime).
      #
      # Source: a statically-linked proot build for aarch64/Android, from
      # the well-known "freeroot" project (same trick used by several
      # no-root Linux-on-Android one-liners). If this URL ever goes stale,
      # see README.md -> "proot binary kaynağı" for two alternative sources.
      # --------------------------------------------------------------
      - name: Fetch static proot (arm64)
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libproot.so \
            https://raw.githubusercontent.com/foxytouxxx/freeroot/main/proot
          chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so
          file app/src/main/jniLibs/arm64-v8a/libproot.so

      # No gradlew is committed to this repo (its wrapper jar is a binary we
      # can't hand-write) — this action installs Gradle itself instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT || env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DTFA-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
